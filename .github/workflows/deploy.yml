name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cf-workers-design-system
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Test the built site through the Worker in workerd
        run: npm test

      # Agents consume manifest.json and agent-index.json and are pointed at
      # the published schemas; never deploy documents that break them.
      - name: Validate manifest and agent index against published schemas
        run: npm run validate:schemas

      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
